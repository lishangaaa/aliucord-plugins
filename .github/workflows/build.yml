name: Build

on:
  push:
    branches-ignore:
      - builds
  workflow_dispatch:

# 赋予 GitHub Actions 推送构建产物的写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 0

      - name: Checkout Builds Branch
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins & Updater
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          # 同时执行构建插件与生成全局 updater.json
          ./gradlew make generateUpdaterJson --no-daemon
          
          mkdir -p $GITHUB_WORKSPACE/compiled
          # 提取各插件 build/ 下的 .zip 产物
          find . -path "*/build/*.zip" -exec cp {} $GITHUB_WORKSPACE/compiled/ \;
          # 精准复制 Gradle 自动生成的根目录 updater.json
          if [ -f "build/updater.json" ]; then
            cp build/updater.json $GITHUB_WORKSPACE/compiled/
          fi

      - name: Upload plugins as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: compiled

      - name: Push builds
        if: github.ref == 'refs/heads/main'
        run: |
          cd $GITHUB_WORKSPACE/builds
          cp -rf $GITHUB_WORKSPACE/compiled/* .
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push origin builds