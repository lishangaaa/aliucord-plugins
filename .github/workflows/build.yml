name: Build

on:
  push:
    branches-ignore:
      - builds
  pull_request:
    branches-ignore:
      - builds
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 2

      - name: Checkout builds
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew :AITranslate:make
          mkdir -p $GITHUB_WORKSPACE/compiled
          cp $GITHUB_WORKSPACE/src/**/build/*.zip $GITHUB_WORKSPACE/compiled/ || true

      - name: Upload plugins as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: compiled

      - name: Push builds
        if: github.ref == 'refs/heads/main'
        run: |
          cd $GITHUB_WORKSPACE/builds
          cp $GITHUB_WORKSPACE/compiled/* . || true
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push