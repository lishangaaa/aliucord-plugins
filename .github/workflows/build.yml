name: Build

on:
  push:
    branches-ignore:
      - builds
  workflow_dispatch:

# 赋予 GitHub Actions 向仓库推送代码的写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 0

      - name: Checkout builds
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make
          mkdir -p $GITHUB_WORKSPACE/compiled
          # 提取所有编译出的 .zip 与自动生成的 updater.json
          find . -type f -name "*.zip" -exec cp {} $GITHUB_WORKSPACE/compiled/ \;
          find . -type f -name "updater.json" -exec cp {} $GITHUB_WORKSPACE/compiled/ \;

      - name: Upload plugins as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: compiled

      - name: Push builds
        if: github.ref == 'refs/heads/main'
        run: |
          cd $GITHUB_WORKSPACE/builds
          cp -rf $GITHUB_WORKSPACE/compiled/* .
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push origin builds